server:
  port: 8080

spring:
  application:
    name: java-concurrent-pipeline
  main:
    banner-mode: off

pipeline:
  cli:
    enabled: false
    mode: BOTH
    items: 400
    latency-ms: 15
    workers: 8
    queue-capacity: 32
    batch-size: 50
    ordering: UNORDERED

logging:
  level:
    root: INFO
    dev.pipeline.metasync: INFO
